[package]
name = "packdb-traceql-parser"
version = "0.1.1"
edition = "2024"
rust-version = "1.94.1"
description = "A dependency-light parser for the TraceQL trace query language"
license = "Apache-2.0"
repository = "https://github.com/packdb-oss/traceql-parser"
documentation = "https://docs.rs/packdb-traceql-parser"
readme = "README.md"
keywords = ["traceql", "tempo", "parser", "tracing", "query"]
categories = ["parser-implementations"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/corpus/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/COMPATIBILITY.md",
    "/CHANGELOG.md",
]
# Private staging: publication is a separate, reviewed release action.
publish = false

[dependencies]
thiserror = "2.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# unwrap/expect/indexing/panic are denied outside tests by attributes in
# src/lib.rs; tests may use them.
[lints.clippy]
todo = "warn"
unimplemented = "deny"
dbg_macro = "deny"
